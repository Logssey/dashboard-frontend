# An HTTPS load balancer/reverse proxy must be the only public entrypoint.
# Both containers share a private network; the backend service is named "api".
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # URLs can contain sensitive source metadata. No HTTP access log by default.
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        location = /healthz { access_log off; return 200 'ready\n'; }
        # 런타임 수집(클러스터 Falcosidekick -> /internal/v1/runtime/). Re:Used NAT 공인 IP에서 온 요청만 넘기고,
        # 수집 토큰(X-Runtime-Collector-Token)은 API가 확인한다. 실제 접속 IP는 ALB(VPC 안)가 붙인 X-Forwarded-For 마지막 값
        location /internal/v1/runtime/ {
            set_real_ip_from 10.20.0.0/16;
            real_ip_header X-Forwarded-For;
            allow 18.182.174.122;
            deny all;
            client_max_body_size 256k;
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /internal/ { return 404; }
        location /api/v1/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
            proxy_buffering off;
            proxy_cache off;
        }
        location /api/ { return 404; }
        # GitHub 조직 로그인 (ADR-D010): 로그인 시작과 GitHub 콜백만 API 로 넘긴다. /login 화면은 SPA 그대로
        location ~ ^/(oauth2/authorization|login/oauth2/code)/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
            proxy_buffering off;
            proxy_cache off;
        }
        location /assets/ { try_files $uri =404; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
