name: Secret frontend release checks
on:
  pull_request:
    branches: [feat/secret]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-frontend-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the non-root frontend image
        run: docker build -t logssey-secret-frontend:ci .
      - name: Verify SPA routes and same-origin API proxy
        run: sh deploy/verify-image.sh
