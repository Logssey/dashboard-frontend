# Dashboard deploy: every merge to develop goes to https://logssey.re-used.store.
# tests -> frontend image to ECR (tag = commit) -> SSM document logssey-dashboard-deploy runs /opt/logssey/deploy.sh on the host.
# deploy.sh dumps the database, swaps the digest, checks the site and rolls back to the previous image if it does not come up.
# AWS side: infrastructure terraform/environments/logssey-dashboard/deploy.tf (the role only accepts develop runs of this repo).
# Repository variables: DASHBOARD_DEPLOY_ROLE_ARN, DASHBOARD_INSTANCE_ID (terraform output deploy_role_arns.frontend, instance_id).
# Set DASHBOARD_SKIP_TESTS=true to temporarily skip tests while keeping build and deploy enabled.
# Remove it or set it to false to require tests again.
# Actions are pinned to the same commit SHAs as secret-release-check.yml and dashboard-backend's deploy workflow.
name: Dashboard deploy

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-deploy-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  SERVICE: frontend
  ECR_REPOSITORY: logssey/dashboard-frontend
  DEPLOY_DOCUMENT: logssey-dashboard-deploy

jobs:
  test:
    name: Frontend tests and build
    if: vars.DASHBOARD_SKIP_TESTS != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Build and deploy the frontend
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/develop' &&
      (needs.test.result == 'success' ||
       (vars.DASHBOARD_SKIP_TESTS == 'true' && needs.test.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deploy settings
        env:
          ROLE_ARN: ${{ vars.DASHBOARD_DEPLOY_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::Set repository variables DASHBOARD_DEPLOY_ROLE_ARN and DASHBOARD_INSTANCE_ID"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DASHBOARD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build and push the image
        id: image
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          tag="${GITHUB_SHA::12}"
          image="$registry/$ECR_REPOSITORY:$tag"
          # Tags are immutable, so a re-run of the same commit reuses the image it already pushed
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" > /dev/null 2>&1; then
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            docker build -t "$image" .
            docker push "$image"
          fi
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" \
            --query 'imageDetails[0].imageDigest' --output text)
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No digest for $image"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy on the dashboard host
        env:
          INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "$DEPLOY_DOCUMENT" \
            --parameters "{\"service\":[\"$SERVICE\"],\"digest\":[\"$DIGEST\"]}" \
            --comment "${GITHUB_REPOSITORY#*/} ${GITHUB_SHA::12} run $GITHUB_RUN_ID" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"
          # deploy.sh waits for another deploy, dumps the database and checks the site for up to 5 minutes;
          # the document stops it after 15 minutes
          status=Pending
          for _ in $(seq 1 96); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)
            case $status in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          for stream in StandardOutputContent StandardErrorContent; do
            echo "--- $stream"
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query "$stream" --output text || true
          done
          echo "Deploy: $status (SSM command \`$command_id\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != Success ]; then
            echo "::error::Deploy $status. If the output says 'rolled back', the previous image is running."
            exit 1
          fi
